name: runnit
description: "Runnit — 러닝크루 랭킹 커뮤니티. GPS/웨어러블 러닝 트래킹, 기록, 랭킹, 뱃지 게이미피케이션."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ── 상태관리 ───────────────────────────────────────────────
  # Riverpod: 컴파일 타임 안전성, Provider override 기반 목킹,
  # GPS 스트림처럼 백그라운드 갱신 상태를 여러 화면이 구독하는 구조에 적합.
  flutter_riverpod: ^2.5.1

  # ── 불변 모델 / 직렬화 ─────────────────────────────────────
  # freezed: copyWith/==/toString + union 타입. json_serializable로 직렬화 자동화.
  # 수동 toJson/fromJson은 필드 추가 시 누락되기 쉬워 금지.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── 라우팅 ────────────────────────────────────────────────
  # go_router: 딥링크(챌린지 초대 링크), 중첩 라우트(바텀 네비 shell) 지원.
  go_router: ^14.2.7

  # ── 위치 / 센서 / 권한 ────────────────────────────────────
  # geolocator: 위치 스트림 + 정확도/거리필터 옵션. 거리 계산 유틸(Haversine) 내장.
  geolocator: ^13.0.1
  # flutter_background_service: 화면 꺼짐/앱 백그라운드 상태에서 트래킹 세션 유지.
  flutter_background_service: ^5.0.10
  # health: HealthKit(iOS) / Health Connect(Android) 통합 래퍼.
  #   Apple Watch는 HealthKit 경유, Garmin은 Garmin Connect → HealthKit/Health Connect
  #   동기화 경유로 심박수·워크아웃을 읽는다.
  health: ^11.1.0
  # permission_handler: iOS/Android 위치·활동·건강 권한 흐름 통합.
  permission_handler: ^11.3.1

  # ── 백엔드 ────────────────────────────────────────────────
  # supabase_flutter: Auth + Postgres + Realtime(랭킹 구독) + Storage 단일 SDK.
  supabase_flutter: ^2.6.0

  # ── 로컬 저장 ─────────────────────────────────────────────
  # drift: 진행 중 러닝 세션의 RunSample을 오프라인에서 append-only로 저장.
  #   네트워크 없이 러닝하고 종료 후 업로드하는 흐름의 핵심.
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # shared_preferences: 온보딩 완료 여부, 단위(km/mi) 설정 등 경량 키-값.
  shared_preferences: ^2.3.2

  # ── 지도 / 차트 ───────────────────────────────────────────
  # flutter_naver_map: PRD §7 확정 지도 SDK. 국내 지도 품질·무료 한도 우위.
  #   NCP 클라이언트 ID가 필요하다 (`lib/core/map/naver_map_config.dart`).
  #   글로벌 확장 시 다른 SDK로 교체할 수 있도록 지도 표면 생성을
  #   `mapSurfaceBuilderProvider` 하나로 모아 격리했다.
  flutter_naver_map: ^1.4.4
  # latlong2: **앱 내부 표준 좌표 모델**. 도메인(공유 카드·폴리라인 디코딩·
  #   집계)이 전부 이 타입에 묶여 있고, 지도 SDK의 NLatLng로는 지도 위젯
  #   경계(`lib/core/map/map_geo.dart`)에서만 변환한다.
  latlong2: ^0.9.1
  # fl_chart: 페이스/고도/심박 추이 시각화.
  fl_chart: ^0.69.0
  # flutter_svg: Figma에서 내려받은 벡터 아이콘(내비게이션/헤더/티어 배지)을
  # 그대로 렌더링 — 손으로 다시 그리지 않고 원본 SVG를 쓴다.
  flutter_svg: ^2.0.10+1

  # ── 공유 (HI-08 / HI-10) ──────────────────────────────────
  # share_plus: OS 공유 시트(iOS UIActivityViewController / Android ACTION_SEND).
  #   인스타 스토리로 카드 PNG를 넘기는 유일한 경로다.
  #   ⚠️ 이미지 **캡처**용 패키지는 추가하지 않는다 — `screenshot` 등은 Flutter 내장
  #   `RenderRepaintBoundary.toImage()`를 30줄 감싼 래퍼일 뿐이고, 우리는 출력 해상도를
  #   1080×1920으로 고정하려고 pixelRatio를 직접 계산해야 해서 래퍼가 오히려 방해된다.
  #   (`features/sharing/data/share_card_renderer.dart` 참조)
  share_plus: ^10.1.4

  # ── 푸시 알림 (PRD §5.10 NT-01~08) ────────────────────────
  # firebase_core: FCM SDK의 전제. `Firebase.initializeApp()`이 네이티브 설정
  #   파일(`google-services.json` / `GoogleService-Info.plist`)을 읽는다.
  #   ⚠️ 설정 파일이 없는 개발 환경에서도 앱이 떠야 하므로 초기화는
  #   `lib/core/notifications/firebase_bootstrap.dart`에서 try/catch로 감싼다
  #   (지도 초기화와 같은 규약 — `main.dart` 참조).
  # firebase_messaging: FCM 토큰 획득/갱신 + 포그라운드/백그라운드 메시지 수신.
  #   발송은 전적으로 서버(Edge Function `push-dispatch`)의 몫이고, 클라이언트는
  #   토큰 등록과 수신·딥링크만 담당한다.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # ── 유틸 ─────────────────────────────────────────────────
  intl: ^0.19.0          # 날짜/숫자 로케일 포맷 (페이스 표시)
  collection: ^1.18.0
  uuid: ^4.5.0           # 클라이언트 생성 RunRecord id (오프라인 업로드 멱등성)
  logger: ^2.4.0
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.20.1

flutter:
  uses-material-design: true
  assets:
    - assets/badges/PB/
    - assets/badges/count/
    - assets/badges/date/
    - assets/badges/distance/
    - assets/badges/event/
    - assets/badges/level/
    - assets/badges/ranking/
    - assets/badges/route/
    - assets/badges/session/
    - assets/badges/special/
    - assets/badges/speed/
    - assets/badges/strict/
    - assets/badges/tier/
    - assets/badges/wearable/
    - assets/icons/

  # Figma가 지정한 본문 서체. 가변 폰트 하나로 Regular~Bold 전 굵기를 커버한다
  # (별도 정적 굵기 파일을 따로 등록할 필요 없음 — TextStyle.fontWeight가
  # 자동으로 가장 가까운 굵기 축으로 매핑된다).
  fonts:
    - family: Pretendard Variable
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    # 공유 카드(오버레이 스티커) 전용 — 가변 폰트, 굵기는 TextStyle.fontWeight로 매핑.
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-VariableFont_wght.ttf
